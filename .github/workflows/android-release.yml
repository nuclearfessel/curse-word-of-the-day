name: Android APK release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: android-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK on EAS
        run: eas build --platform android --profile android-apk --non-interactive --json > build-output.json

      - name: Extract build artifact URL
        id: artifact
        run: |
          URL=$(node -e "const b=require('./build-output.json'); const build=Array.isArray(b)?b[0]:b; console.log(build.artifacts.buildUrl);")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download APK
        run: curl -L -o CurseWordOfTheDay.apk "${{ steps.artifact.outputs.url }}"

      - name: Delete previous EAS builds for this profile
        run: |
          NEW_ID=$(node -e "const b=require('./build-output.json'); const build=Array.isArray(b)?b[0]:b; console.log(build.id);")
          eas build:list --platform android --build-profile android-apk --non-interactive --json --limit 50 > all-builds.json
          node -e "
            const fs = require('fs');
            const builds = JSON.parse(fs.readFileSync('all-builds.json'));
            const ids = builds.map(b => b.id).filter(id => id !== '$NEW_ID');
            fs.writeFileSync('old-build-ids.txt', ids.join('\n'));
          "
          while IFS= read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting old build $id"
              eas build:delete "$id" --non-interactive || true
            fi
          done < old-build-ids.txt

      - name: Publish rolling GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-latest --yes || true
          git push origin :refs/tags/android-latest || true
          gh release create android-latest CurseWordOfTheDay.apk \
            --title "Android build (latest)" \
            --notes "Automatically built from commit ${{ github.sha }} on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
